<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>プレイリスト並び替え</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f7;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b76;
    --accent: #ff0033;
    --border: #e2e2e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa2;
      --border: #2c2c30;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 18px;
    margin: 0 0 10px;
  }
  select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
  }
  #status {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  #list {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .handle {
    font-size: 22px;
    color: var(--muted);
    padding: 4px 8px;
    touch-action: none;
    user-select: none;
    cursor: grab;
  }
  .thumb {
    width: 44px;
    height: 44px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  .meta { min-width: 0; flex: 1; }
  .title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .channel {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sortable-ghost { opacity: 0.35; }
  .sortable-chosen { background: color-mix(in srgb, var(--accent) 8%, var(--card-bg)); }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
  }
  button:disabled { opacity: 0.5; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>プレイリスト並び替え</h1>
  <select id="playlistSelect">
    <option value="">プレイリストを選択...</option>
  </select>
</header>

<div id="status"></div>
<div id="list"></div>

<footer>
  <button id="saveBtn" disabled>この並び順を保存</button>
</footer>

<script>
const playlistSelect = document.getElementById("playlistSelect");
const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const saveBtn = document.getElementById("saveBtn");

let sortable = null;
let originalOrder = [];

function setStatus(text) {
  statusEl.textContent = text;
}

async function loadPlaylists() {
  setStatus("プレイリストを読み込み中...");
  const res = await fetch("/api/playlists");
  const playlists = await res.json();
  playlists.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = `${p.title} (${p.count}曲)`;
    playlistSelect.appendChild(opt);
  });
  setStatus(playlists.length ? "プレイリストを選んでください" : "プレイリストが見つかりませんでした");
}

function renderItems(items) {
  listEl.innerHTML = "";
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">曲がありません</div>';
    saveBtn.disabled = true;
    return;
  }
  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "item";
    row.dataset.playlistItemId = item.playlistItemId;
    row.dataset.videoId = item.videoId;
    row.innerHTML = `
      <span class="handle">☰</span>
      <img class="thumb" src="${item.thumbnail || ""}" alt="">
      <div class="meta">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="channel">${escapeHtml(item.channel)}</div>
      </div>
    `;
    listEl.appendChild(row);
  });

  if (sortable) sortable.destroy();
  sortable = new Sortable(listEl, {
    handle: ".handle",
    animation: 150,
    onEnd: checkDirty,
  });

  saveBtn.disabled = true;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function currentOrderIds() {
  return [...listEl.querySelectorAll(".item")].map(el => el.dataset.playlistItemId);
}

function checkDirty() {
  const current = currentOrderIds();
  const changed = JSON.stringify(current) !== JSON.stringify(originalOrder);
  saveBtn.disabled = !changed;
}

playlistSelect.addEventListener("change", async () => {
  const playlistId = playlistSelect.value;
  if (!playlistId) return;
  setStatus("曲を読み込み中...");
  listEl.innerHTML = "";
  const res = await fetch(`/api/playlist/${playlistId}/items`);
  const items = await res.json();
  originalOrder = items.map(i => i.playlistItemId);
  renderItems(items);
  setStatus(`${items.length}曲。ハンドル(☰)をドラッグして並び替えできます`);
});

saveBtn.addEventListener("click", async () => {
  const playlistId = playlistSelect.value;
  if (!playlistId) return;
  const rows = [...listEl.querySelectorAll(".item")];
  const items = rows.map(el => ({
    playlistItemId: el.dataset.playlistItemId,
    videoId: el.dataset.videoId,
  }));

  saveBtn.disabled = true;
  setStatus("保存中... (曲数が多いと時間がかかります)");

  const res = await fetch(`/api/playlist/${playlistId}/reorder`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items }),
  });
  const results = await res.json();
  const failed = results.filter(r => !r.ok);

  if (failed.length) {
    setStatus(`${failed.length}件の更新に失敗しました。もう一度試してください。`);
    saveBtn.disabled = false;
  } else {
    originalOrder = currentOrderIds();
    setStatus("保存しました");
  }
});

loadPlaylists();
</script>

</body>
</html>
